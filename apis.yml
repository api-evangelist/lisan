aid: lisan
name: Lisan
description: Lisan is an AI-powered Arabic proofreading and writing-assistance platform, headquartered
  in the UAE and backed by 500 Global. Its language engine detects and corrects eight classes of
  error in Arabic text — spelling, grammar, morphology, semantics, style, formatting, proper nouns,
  and citations — and returns context-aware suggestions together with explanations that help writers
  build language skill, plus error statistics and performance reporting. Lisan reaches writers
  through a web application, a Windows desktop app, Microsoft Word, PowerPoint and Outlook add-ins,
  Chrome and Edge browser extensions, and a WordPress plugin. For institutions it adds enforcement
  of an organization's own style guide, writing-productivity tooling, and analytics dashboards, and
  it advertises an API and SDK for developers. As of July 2026 that developer surface is not
  publicly documented — Lisan publishes no developer portal, API reference, base URL, or machine-readable
  specification, and API/SDK access is arranged through its institutional contact channel.
